packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@parcel/watcher': set this to true or false
  '@swc/core': set this to true or false
  esbuild: true
  msgpackr-extract: true
  pnpm: true
  unrs-resolver: true
  workerd: true

supportedArchitectures:
  os:
    - current
  cpu:
    - current
  libc:
    - current
