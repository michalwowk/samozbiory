# Credentials come from the root .env file (see .env.example).
# docker compose substitutes ${VAR} from .env automatically; the :? form fails
# loudly on a missing value instead of silently starting a differently-named database.
volumes:
  postgres_data:
    driver: local

services:
  db:
    platform: linux/amd64
    image: postgres:18.6 # pinned: Postgres 18 moved PGDATA to /var/lib/postgresql
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?set POSTGRES_USER in .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      # lets `pnpm db:push` run right after `docker compose up -d` without racing initdb
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
